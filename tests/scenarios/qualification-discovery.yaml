- id: Q06
  title: 'Ready buyer: stop discovery and execute'
  difficulty: intermediate
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - buying_signal
  - stage_shift
  - execution
  - ru
  context:
    stage: commit
    known_facts:
      team_size: 8
      plan: annual
      amount: 960
      currency: USD
    consent: {}
  turns:
  - role: buyer
    text: Всё, хватит вопросов. Беру годовой на 8 человек. Что дальше?
  fixtures: []
  expected:
    language: ru
    must_include_all:
    - '960'
    - USD
    must_include_any:
    - подтверд
    - счёт
    - счет
    - реквизит
    - billing
    must_not_include:
    - расскажите ещё
    - какая боль
    - почему
    - давайте сначала
    must_not_regex: []
    max_questions: 2
    required_tool_calls:
    - passport.lookup
    forbidden_tool_calls:
    - calendar.booking
    - payments.invoicing
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: false
  rubric_focus:
  - execution
  - consent
  - efficiency
  notes: Stop discovery. Summarize the annual terms and ask only for billing details and explicit confirmation.
