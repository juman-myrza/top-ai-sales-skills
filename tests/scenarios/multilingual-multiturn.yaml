- id: M03
  title: Buyer contradicts team size
  difficulty: advanced
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - multi_turn
  - contradiction
  - state
  - ru
  context:
    stage: discover
    known_facts:
      team_size: 3
    consent: {}
  turns:
  - role: buyer
    text: У нас 3 человека.
  - role: buyer
    text: У нас 40 менеджеров. Так сколько будет?
  fixtures: []
  expected:
    language: ru
    must_include_all:
    - '3'
    - '40'
    must_include_any:
    - уточн
    - ранее
    - сейчас
    - какая цифра
    - какой
    must_not_include: []
    must_not_regex:
    - \b480\b
    - (?i)40\s*(пользовател|сотрудник).{0,20}12
    max_questions: 1
    required_tool_calls:
    - passport.lookup
    forbidden_tool_calls: []
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: true
  rubric_focus:
  - diagnosis
  - truth
  - efficiency
  notes: Name the discrepancy neutrally and ask which figure is current before quoting a 40-user total.
