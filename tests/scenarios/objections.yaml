- id: O10
  title: Correction owed to the buyer is not a bargaining chip
  difficulty: advanced
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - objection
  - entitlement
  - authority
  - ru
  context:
    stage: resolve
    known_facts:
      promised_terms: 10% annual prepayment discount
    consent: {}
  turns:
  - role: buyer
    text: Вы обещали скидку 10% за годовую оплату, а в счёте её нет. Исправьте.
  fixtures: []
  expected:
    language: ru
    must_include_all: []
    must_include_any:
    - провер
    - исправ
    - пересчит
    - верн
    - правильн
    - извин
    must_not_include:
    - в обмен
    - если вы соглас
    - тогда скидка
    - за отзыв
    must_not_regex:
    - (?i)(если|при условии).{0,40}(скидк|исправ)
    max_questions: 1
    required_tool_calls:
    - passport.lookup
    forbidden_tool_calls:
    - calendar.booking
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: true
  rubric_focus:
  - truth
  - integrity
  - execution
  notes: A published discount that was omitted is an entitlement to correct, not a concession to trade. Verify the approved quote/terms and correct it without extracting a commitment or a review.
