schema_version: 1.0.0
category: multilingual-multiturn
scenarios:
- id: M01
  title: Russian to Kyrgyz switch
  difficulty: intermediate
  passport: direct-sale-nimbus-notes
  locale: ky
  tags:
  - language
  - code_switch
  - ky
  context:
    stage: open
    known_facts:
      team_size: 8
    consent: {}
  turns:
  - role: buyer
    text: Сколько стоит для 8 человек?
  - role: buyer
    text: Кыргызча жазсаңыз болобу? Канча турат?
  fixtures: []
  expected:
    language: ky
    must_include_all:
    - '12'
    - USD
    must_include_any:
    - айына
    - ай
    - адам
    - үчүн
    must_not_include:
    - стоимость
    - руб
    - сом
    must_not_regex: []
    max_questions: 1
    required_tool_calls:
    - passport.lookup
    forbidden_tool_calls: []
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: true
  rubric_focus:
  - language
  - truth
  - efficiency
  notes: Switch fully to Kyrgyz on the latest turn; preserve the exact price. Kyrgyz is a draft pending native review.
