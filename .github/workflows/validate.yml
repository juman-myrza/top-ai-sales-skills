name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation and checker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Validate repository structure and schemas
        run: python scripts/validate_repository.py

      - name: Check the response checker against the hand-written fixture
        run: |
          python scripts/evaluate_responses.py \
            --responses tests/fixtures/smoke-responses.jsonl \
            --allow-partial

      - name: Run checker regression tests
        run: python scripts/test_checker.py

      - name: Test focused live-evaluation scenarios and scorer
        run: |
          python tests/live/test_score_live_eval.py
          python tests/live/run_live_eval.py \
            --arm candidate \
            --scenarios tests/live/offer-status-scenarios.yaml \
            --dry-run

      - name: Verify the installed artifact is self-contained
        run: python scripts/test_installed_artifact.py

      - name: Test the passport lookup adapter
        run: python scripts/test_passport_lookup.py

      - name: Round-trip the shell install and uninstall wrappers
        run: sh scripts/test_install_uninstall.sh

      - name: Verify the scenario corpus renders as JSONL
        run: |
          python scripts/render_scenarios.py \
            --format jsonl \
            --out /tmp/scenarios.jsonl
          test -s /tmp/scenarios.jsonl

      - name: Confirm no Hermes profile is modified
        run: |
          test ! -e "$HOME/.hermes/skills/sales" \
            || { echo "CI unexpectedly wrote to ~/.hermes"; exit 1; }
