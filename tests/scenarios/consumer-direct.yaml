    known_facts:
      plan: self-paced
      amount: 4900
      currency: KGS
    consent: {}
  turns:
  - role: buyer
    text: Беру. Как оплатить?
  fixtures: []
  expected:
    language: ru
    must_include_all:
    - '4900'
    must_include_any:
    - сом
    - KGS
    - оплат
    - ссылк
    - счёт
    - счет
    must_not_include:
    - звон
    - консультац
    - встреча
    - оплата прошла
    - оплачено
    must_not_regex: []
    max_questions: 1
    required_tool_calls:
    - passport.lookup
    forbidden_tool_calls:
    - calendar.booking
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: false
  rubric_focus:
  - truth
  - execution
  - consent
  notes: A ready consumer buys directly. Summarize terms, then use the approved payment path; do not route to a meeting.
