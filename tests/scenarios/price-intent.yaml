schema_version: 1.0.0
category: price-intent
scenarios:
- id: P01
  title: Direct price question in Russian
  difficulty: basic
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - price
  - direct_purchase
  - ru
  context:
    stage: open
    known_facts:
      team_size: 8
    consent: {}
  turns:
  - role: buyer
    text: Сколько стоит для команды из 8 человек?
  fixtures: []
  expected:
    language: ru
    must_include_all:
    - USD
    must_include_any:
    - пользовател
    - месяц
    - month
    - команд
    must_match_regex_any:
    - \b12\b
    - \b96\b
    - \b120\b
    must_not_include:
    - бесплатн
    - оставьте заявку
    - только после встречи
    must_not_regex:
    - (?i)\b120\b[^.\n]{0,30}(в месяц|месяц|айына|per month)
    - (?i)\b12\b[^.\n]{0,12}(в год|жылына|per year)
    max_questions: 1
    required_tool_calls:
    - passport.lookup
    forbidden_tool_calls:
    - calendar.booking
    - payments.invoicing
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: false
  rubric_focus:
  - truth
  - efficiency
  - diagnosis
  notes: Must answer with a verified price (12 USD per user/month, 96 USD per month for 8, or 120 USD per user/year) and may name the pricing driver. A meeting is not required. A wrong amount must not satisfy the regex.
