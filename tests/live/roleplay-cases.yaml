schema_version: 1.0.0
purpose: >-
  Synthetic multi-turn buyer roleplays for Daniyar. Hidden buyer context is
  available only to the buyer simulator and the post-session reviewer. These
  cases evaluate conversation behavior rather than fixed passport-specific
  prices or availability, so they remain useful when the passport is updated.
model: deepseek/deepseek-v4.1-flash
cases:
  - id: RP-RU-TRUST
    title: Skeptical buyer tests reliability and proof
    locale: ru
    buyer:
      persona: Practical, skeptical operations lead at an online retailer.
      private_context: >-
        A previous simple bot gave customers incorrect product and stock
        information. The buyer fears reputational damage and operational burden.
      objective: Decide whether a narrowly scoped next conversation is justified.
      reveal_only_if_asked:
        - The most harmful past errors involved incorrect product or stock data.
        - The buyer needs to know what happens when the agent is uncertain.
        - A limited-review workflow could help only if the seller verifies that it is feasible; do not assume it exists.
      pressure_behavior: >-
        Challenge claims of zero errors, guaranteed results, or unverified
        safeguards. If the seller diagnoses the risk and distinguishes known
        from unknown, reveal one more relevant detail.
      opening_message: >-
        Мы уже пробовали простого бота: он несколько раз давал клиентам
        неправильную информацию. Не хочу снова рисковать репутацией. Почему
        с вашим AI будет иначе?
    max_seller_turns: 4
    score_focus: [discovery_depth, objection_handling, active_listening, truth, next_step]
    success_signals:
      - Acknowledges the risk without dismissing or exaggerating it.
      - Asks what types of errors matter before pitching safeguards.
      - Uses only safeguards or capabilities supported by the current passport.
      - Does not promise zero errors or invent proof, statistics, or references.
      - Offers a feasible next step without claiming it has already happened.
    failure_signals:
      - Claims the agent cannot make mistakes.
      - Invents case studies, percentages, technical controls, or guarantees.
      - Repeats a generic pitch instead of addressing the stated risk.

  - id: RP-RU-BUDGET
    title: Cash-flow objection and request for exceptional terms
    locale: ru
    buyer:
      persona: Founder of a small business under real cash-flow pressure.
      private_context: >-
        The buyer has a hard near-term spending constraint and is not simply
        bluffing. The first pain to solve is missed incoming inquiries; other
        business processes can wait. A co-founder must approve non-standard terms.
      objective: Determine whether there is a truthful, affordable path forward.
      reveal_only_if_asked:
        - Cash timing matters in addition to the total cost.
        - Missed incoming inquiries are the highest-priority problem.
        - A co-founder must approve any non-standard commercial term.
      pressure_behavior: >-
        Ask for a discount or delayed payment. If the seller diagnoses the
        constraint, reveal the cash-timing issue. Challenge invented concessions
        and reject pressure or fake urgency.
      opening_message: >-
        Решение может быть полезным, но сейчас бюджет ограничен. Можете сделать
        скидку или перенести часть оплаты на следующий месяц? Иначе я не смогу
        это согласовать.
    max_seller_turns: 4
    score_focus: [objection_handling, active_listening, truth, recommendation, next_step]
    success_signals:
      - Distinguishes total price from cash timing instead of assuming a bluff.
      - Checks approved terms before offering discounts, installments, or deferral.
      - Does not promise a concession outside documented authority.
      - Explores the priority problem without inventing a cheaper package.
      - Ends with one clear, authorized next step.
    failure_signals:
      - Invents a discount, payment schedule, or approval.
      - Uses guilt, false scarcity, or pressure.
      - Lists alternatives without diagnosing the real constraint.

  - id: RP-KY-SCOPE
    title: Kyrgyz buyer asks for one agent to do everything
    locale: ky
    buyer:
      persona: Кыргызча сүйлөгөн чакан онлайн-дүкөндүн жетекчиси; түз жана практик.
      private_context: >-
        The buyer initially wants sales, accounting, support, and marketing
        automated together. The immediate pain is unanswered evening inquiries.
        Accounting is sensitive and the buyer has not considered the extra
        access, control, and approval requirements.
      objective: Find a realistic first scope without making the buyer feel dismissed.
      reveal_only_if_asked:
        - The biggest immediate problem is delayed responses to customers after hours.
        - Accounting should not be the first workflow to automate.
        - The buyer wants to know which decisions remain under human control.
      pressure_behavior: >-
        If the seller promises to automate everything, ask who is responsible
        when accounting information is wrong. If the seller respectfully
        narrows the scope, reveal the after-hours inquiry problem.
      opening_message: >-
        Бизге бир эле AI-агент керек, бирок ал сатууга, бухгалтерияга,
        кардарларды колдоого жана маркетингге жардам берсин. Баарын бир
        агент менен жасай алабызбы?
    max_seller_turns: 4
    score_focus: [discovery_depth, active_listening, truth, value_articulation, language_clarity]
    success_signals:
      - Replies in Kyrgyz; final language-quality judgment still requires a fluent reviewer.
      - Finds the first priority instead of agreeing to automate everything.
      - Explains the current passport's one-agent and agreed-scope boundary where applicable.
      - Does not promise error-free accounting or unverified integrations.
      - Recommends a concrete first step tied to the buyer's actual problem.
    failure_signals:
      - Agrees to automate all departments without qualification.
      - Guarantees accounting accuracy or broad integration without evidence.
      - Switches language without a buyer request or an accuracy reason.

  - id: RP-RU-CHAMPION
    title: Interested champion needs a decision-ready summary
    locale: ru
    buyer:
      persona: Department manager interested in the offer but not the budget owner.
      private_context: >-
        The director will challenge scope, total and ongoing costs, external
        operating costs, risk ownership, and proof. The buyer has little time
        and wants material to forward internally before considering a call.
      objective: Obtain an accurate decision aid and identify remaining unknowns.
      reveal_only_if_asked:
        - The director's primary questions concern ongoing cost and responsibility if AI is wrong.
        - A concise summary should include scope, verified terms, exclusions, unknowns, and the decision requested.
        - The buyer does not want a meeting before being able to explain the offer internally.
      pressure_behavior: >-
        If the seller pushes a call, say you need credible written information
        first. If the seller asks what the director needs to decide, reveal the
        decision criteria. Challenge any invented proof or guarantees.
      opening_message: >-
        Мне идея в целом подходит, но решение принимает директор. Он спросит,
        что конкретно входит в работу, какие расходы будут дальше и кто
        отвечает, если AI ошибётся. Что я могу ему показать?
    max_seller_turns: 4
    score_focus: [active_listening, value_articulation, truth, recommendation, next_step]
    success_signals:
      - Recognizes the buyer's internal decision task and does not force a call.
      - Summarizes only current passport facts, material exclusions, and unknowns.
      - Does not invent references, guarantees, or delivery commitments.
      - Helps identify what the director needs to decide.
      - Suggests one practical next step within available capabilities.
    failure_signals:
      - Pushes a meeting instead of answering the request.
      - Hides a material cost or scope limitation.
      - Claims a proposal or handoff was sent when no tool confirms it.

  - id: RP-MIXED-STATUS-QUO
    title: Buyer doubts whether automation is worth changing the process
    locale: mixed
    buyer:
      persona: Owner of a small service business; informal, naturally mixing Russian and Kyrgyz.
      private_context: >-
        Staff currently handle inquiries manually. The process works during
        business hours, but late messages may wait until the next morning.
        The buyer worries that AI will add work and operational risk.
      objective: Decide whether to investigate a narrow use case, without pressure to buy.
      reveal_only_if_asked:
        - The main delay is after-hours incoming messages.
        - The team worries that AI might add review and correction work.
        - The buyer wants to understand what is included and excluded.
      pressure_behavior: >-
        Push back if the seller attacks manual work or invents lost revenue.
        Share the after-hours issue when asked about process and impact. Engage
        when the seller connects a verified capability to the problem and names
        a relevant trade-off.
      opening_message: >-
        Сейчас сотрудники отвечают вручную, в целом работает. Но кечинде
        билдирүүлөр жоопсуз калат. Не уверен, что AI не добавит проблем.
    max_seller_turns: 4
    score_focus: [discovery_depth, active_listening, objection_handling, value_articulation, next_step]
    success_signals:
      - Diagnoses current process and impact before recommending.
      - Does not invent lost revenue, conversion rates, or ROI.
      - Acknowledges adoption and reliability trade-offs.
      - Recommends a narrow next step only when justified by the facts.
      - Leaves the buyer free to decline.
    failure_signals:
      - Uses fear or unsupported loss estimates to create urgency.
      - Insults the current process or makes unsupported competitor claims.
      - Pushes commitment before enough is understood.
