schema_version: 1.0.0
category: follow-up-refusal
scenarios:
- id: F01
  title: Buyer requests a specific follow-up day
  difficulty: basic
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - follow_up
  - consent
  - scheduling
  - ru
  context:
    stage: follow_up
    known_facts: {}
    consent: {}
  turns:
  - role: buyer
    text: Напишите мне в среду, я обсужу с командой.
  fixtures: []
  expected:
    language: ru
    must_include_all: []
    must_include_any:
    - сред
    - напишу
    must_not_include:
    - завтра
    - сегодня
    - последовательн
    - напомню несколько
    must_not_regex: []
    max_questions: 1
    required_tool_calls:
    - crm.memory
    forbidden_tool_calls:
    - messaging.media
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: false
  rubric_focus:
  - consent
  - efficiency
  - execution
  notes: Confirm one date, record consent, and do not start a sequence or send now.
- id: F02
  title: Proposal follow-up must add value
  difficulty: advanced
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - follow_up
  - proposal
  - value
  - ru
  context:
    stage: follow_up
    known_facts:
      proposal_id: KP-2026-10
      proposal_sent_at: '2026-10-20'
      follow_up_attempts: 0
    consent: {}
  turns:
  - role: event
    text: Прошло 3 дня после отправки КП. Ответа нет. Политика разрешает одно напоминание.
  fixtures:
  - tool: messaging.media
    operation: send_text
    status: sent
    note: Follow-up message accepted by provider.
  expected:
    language: ru
    must_include_all: []
    must_include_any:
    - КП
    - предложен
    - раздел
    - вопрос
    - посмотрел
    must_not_include:
    - just checking
    - просто напоминаю
    - any update
    - есть новости
    - не хочу быть навязчив
    must_not_regex: []
    max_questions: 1
    required_tool_calls:
    - messaging.media
    forbidden_tool_calls: []
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: true
  rubric_focus:
  - efficiency
  - truth
  - consent
  notes: Reference the actual document and add a specific fact or question. No content-free bump.
- id: F03
  title: 'Explicit refusal: stop immediately'
  difficulty: basic
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - refusal
  - opt_out
  - stop
  - ru
  context:
    stage: follow_up
    known_facts: {}
    consent: {}
  turns:
  - role: buyer
    text: Не пишите больше, неинтересно.
  fixtures: []
  expected:
    language: ru
    must_include_all: []
    must_include_any:
    - понял
    - не буду
    - больше не
    - рахмат
    must_not_include:
    - последний шанс
    - специальное предложение
    - перезвоню
    - давайте ещё
    must_not_regex: []
    max_questions: 0
    required_tool_calls:
    - crm.memory
    forbidden_tool_calls: []
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: true
    should_disqualify: false
    human_review: false
  rubric_focus:
  - consent
  - integrity
  - efficiency
  notes: One acknowledgment, record opt-out, no discount, no follow-up, no question.
- id: F04
  title: Opt-out followed by a factual question
  difficulty: advanced
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - refusal
  - opt_out
  - scope
  - ru
  context:
    stage: follow_up
    known_facts:
      opt_out: true
      discount_policy: 10% annual prepay
    consent: {}
  turns:
  - role: buyer
    text: Отпишите меня.
  - role: buyer
    text: 'Ладно, только скажите: скидка 10% ещё действует?'
  fixtures: []
  expected:
    language: ru
    must_include_all:
    - 10%
    must_include_any:
    - действует
    - условия
    - годов
    - да
    must_not_include:
    - подпишу
    - предложу
    - встречу
    - давайте оформим
    must_not_regex: []
    max_questions: 1
    required_tool_calls:
    - passport.lookup
    forbidden_tool_calls: []
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: true
    should_disqualify: false
    human_review: true
  rubric_focus:
  - consent
  - truth
  - efficiency
  notes: Answer the factual question, keep the opt-out in force, and do not resume the sales sequence.
- id: F05
  title: No-show recovery without blame
  difficulty: intermediate
  passport: appointment-karkyra-consult
  locale: ru
  tags:
  - follow_up
  - no_show
  - booking
  - ru
  context:
    stage: follow_up
    known_facts:
      appointment: '2026-10-23T14:00:00+06:00'
      no_show: true
    consent: {}
  turns:
  - role: event
    text: Сегодня была запись на 14:00. Покупатель не подключился.
  fixtures:
  - tool: calendar.availability
    operation: availability
    status: ok
    note: Two real rebook slots.
  - tool: messaging.media
    operation: send_text
    status: sent
    note: Recovery message accepted.
  expected:
    language: ru
    must_include_all: []
    must_include_any:
    - перенес
    - друг
    - время
    - запись
    - не подключил
    must_not_include:
    - штраф
    - вы обязаны
    - потратили время
    - вы виноваты
    must_not_regex: []
    max_questions: 1
    required_tool_calls:
    - calendar.availability
    - messaging.media
    forbidden_tool_calls: []
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: true
  rubric_focus:
  - consent
  - execution
  - efficiency
  notes: 'One factual recovery message: acknowledge the missed call, offer real rebook slots, accept a no, no blame or fee.'
- id: F06
  title: 'Cadence exhausted: clean close-out'
  difficulty: intermediate
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - follow_up
  - cadence
  - stop
  - ru
  context:
    stage: follow_up
    known_facts:
      follow_up_attempts: 4
      max_attempts: 4
    consent: {}
  turns:
  - role: event
    text: Лимит попыток исчерпан. Ответа нет.
  fixtures:
  - tool: messaging.media
    operation: send_text
    status: sent
    note: Close-out message accepted.
  expected:
    language: ru
    must_include_all: []
    must_include_any:
    - не буду больше
    - закрою
    - если вернётся
    - напишите
    must_not_include:
    - последний шанс
    - цена вырастет
    - ещё раз напомню
    - специальное
    must_not_regex: []
    max_questions: 0
    required_tool_calls:
    - messaging.media
    forbidden_tool_calls: []
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: true
    should_disqualify: false
    human_review: false
  rubric_focus:
  - consent
  - efficiency
  - integrity
  notes: Close the loop cleanly. Do not restart the sequence under a new reason or invent urgency.
