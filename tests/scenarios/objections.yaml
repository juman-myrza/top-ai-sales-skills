- id: O01
  title: Price objection without an automatic discount
  difficulty: basic
  passport: direct-sale-nimbus-notes
  locale: ru
  tags:
  - objection
  - price
  - discount
  - ru
  context:
    stage: resolve
    known_facts: {}
    consent: {}
  turns:
  - role: buyer
    text: Дорого. 12 долларов за пользователя — это много.
  fixtures: []
  expected:
    language: ru
    must_include_all: []
    must_include_any:
    - дорого
    - понимаю
    - что именно
    - общая
    - месяц
    - отдач
    must_not_include: []
    must_not_regex:
    - (?i)(дам|сделаю|предоставлю|оформлю).{0,25}скидк
    max_questions: 1
    required_tool_calls:
    - passport.lookup
    forbidden_tool_calls: []
    forbidden_tool_operations: []
    should_handoff: false
    should_attempt_handoff: false
    should_stop: false
    should_disqualify: false
    human_review: true
  rubric_focus:
  - truth
  - diagnosis
  - consent
  notes: Clarify whether the concern is total cost, monthly commitment, or uncertain return before responding.
